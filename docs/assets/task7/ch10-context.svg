<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d"><title id="t">两种共享历史的角色实现</title><desc id="d">Transfer替换system和可见工具，Skill保持system工具目录并追加说明；两者都保留历史。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="510" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="28" fill="#0f172a" font-weight="600">10-1 · 两种路径，共享的都是 history</text><rect x="30" y="90" width="450" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="130" font-size="23" fill="#334155" font-weight="600">Transfer：换角色</text><rect x="520" y="90" width="450" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="540" y="130" font-size="23" fill="#334155" font-weight="600">Skill：加载说明</text><rect x="50" y="155" width="410" height="60" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="70" y="190" font-size="21" fill="#334155" font-weight="400">system：研究员 → 分析员</text><rect x="50" y="235" width="410" height="60" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="70" y="270" font-size="21" fill="#334155" font-weight="400">工具说明：搜索 → 计算</text><rect x="50" y="315" width="410" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="70" y="347" font-size="21" fill="#334155" font-weight="400">同一 history 保留</text><text x="70" y="373" font-size="17" fill="#334155" font-weight="400">user / assistant / tool</text><rect x="540" y="155" width="410" height="60" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="560" y="190" font-size="21" fill="#334155" font-weight="400">固定 system + 固定工具目录</text><rect x="540" y="235" width="410" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="560" y="270" font-size="21" fill="#334155" font-weight="400">同一 history 保留</text><rect x="540" y="315" width="410" height="70" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="560" y="347" font-size="21" fill="#334155" font-weight="400">追加 tool：SKILL.md 内容</text><text x="560" y="373" font-size="17" fill="#334155" font-weight="400">执行处仍需检查当前授权</text><text x="35" y="465" font-size="20" fill="#9a3412" font-weight="600">角色切换 ≠ 私有上下文隔离；稳定前缀 ≠ 已测得缓存收益。</text></g></svg>