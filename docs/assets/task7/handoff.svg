<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="t d"><title id="t">三角色交接链：谁交什么，失败退给谁</title><desc id="d">搜集者交证据包，写作者交文稿包，独立审核者核实；资料问题退搜集者，文稿问题退写作者，通过后进入发布门禁。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:17px;fill:#1e293b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:15px;fill:#475569}</style><rect width="920" height="650" rx="18" fill="#f5f7fb"/><text x="28" y="43" class="title">三角色交接链：谁交什么，失败退给谁</text><text x="28" y="78" class="small">共享任务规格，不共享完整历史；箭头传版本化成果和可追溯引用。</text><rect x="28" y="99" width="864" height="71" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="49" y="128" class="head">三方只读共享：brief / 验收标准 / 安全约束 / 授权证据快照</text><text x="49" y="154" class="small">各自完整对话、搜索试错、草稿中间过程和凭据不随交接传播。</text><rect x="28" y="208" width="260" height="166" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="44" y="243" class="head">资料搜集者</text><text x="44" y="281" class="small">检索与核实来源</text><text x="44" y="311" class="small">提交 EvidencePacket</text><text x="44" y="341" class="small">主张 / 原文定位 / 缺口</text><rect x="330" y="208" width="260" height="166" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="346" y="243" class="head">写作者</text><text x="346" y="281" class="small">据证据形成文稿</text><text x="346" y="311" class="small">提交 DraftBundle</text><text x="346" y="341" class="small">文稿 / 引用映射 / 版本</text><rect x="632" y="208" width="260" height="166" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="648" y="243" class="head">独立审核者</text><text x="648" y="281" class="small">回查原文、重算关键数据</text><text x="648" y="311" class="small">提交 ReviewReport</text><text x="648" y="341" class="small">结论 / 问题 / owner</text><path d="M290 290H325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M592 290H627" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M732 374V412H460V380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="464" y="405" class="small">文稿错误 → 写作者</text><path d="M790 374V464H158V380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="178" y="455" class="small">证据缺口 → 搜集者 → 写作者更新 → 重新审核</text><path d="M858 374V502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="632" y="508" width="260" height="82" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="649" y="539" class="head">通过 → 发布门禁</text><text x="649" y="568" class="small">批准必须匹配当前文稿哈希</text><rect x="28" y="508" width="560" height="82" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="46" y="539" class="head">任务冲突 / 权限问题 / 修订预算耗尽</text><text x="46" y="568" class="small">交任务负责人澄清或停止，不自动转为通过。</text><text x="28" y="624" class="small">设计分类：独立上下文 + 固定协作图 + 条件退回；本图是方案，未运行多 Agent。</text></svg>