<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">9-1 三层验证：证据来自哪里</title><desc id="desc">架构图：业务状态与工具日志支持确定性验证，回复支持模型质量评估，三层共同产生带证据的七维报告。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="560" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="28" fill="#0f172a" font-weight="700">9-1 · 三层验证架构</text><text x="30" y="72" font-size="18" fill="#334155" font-weight="normal">让业务事实、过程合规、表达质量各自有证据</text><rect x="30" y="110" width="250" height="110" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="48" y="142" font-size="21" fill="#0f172a" font-weight="600">业务状态</text><text x="48" y="173" font-size="16" fill="#334155" font-weight="normal">expected_outcome</text><text x="48" y="198" font-size="16" fill="#334155" font-weight="normal">final_state</text><rect x="30" y="240" width="250" height="110" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="48" y="272" font-size="21" fill="#0f172a" font-weight="600">过程记录</text><text x="48" y="303" font-size="16" fill="#334155" font-weight="normal">tool_calls / turn</text><text x="48" y="328" font-size="16" fill="#334155" font-weight="normal">敏感值、声明、承诺</text><rect x="30" y="370" width="250" height="110" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="48" y="402" font-size="21" fill="#0f172a" font-weight="600">对话与任务要求</text><text x="48" y="433" font-size="16" fill="#334155" font-weight="normal">messages + rubric</text><text x="48" y="458" font-size="16" fill="#334155" font-weight="normal">真实回复、允许的替代方案</text><rect x="335" y="110" width="300" height="110" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="353" y="142" font-size="21" fill="#0f172a" font-weight="600">① 结果核验 · Python</text><text x="353" y="173" font-size="16" fill="#334155" font-weight="normal">任务是否完成</text><text x="353" y="198" font-size="16" fill="#334155" font-weight="normal">预期字段 vs 最终字段</text><rect x="335" y="240" width="300" height="110" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="353" y="272" font-size="21" fill="#0f172a" font-weight="600">② 过程核验 · Python</text><text x="353" y="303" font-size="16" fill="#334155" font-weight="normal">规则 / 隐私 / 事实 / 承诺</text><text x="353" y="328" font-size="16" fill="#334155" font-weight="normal">注意：提取错误也会导致误报</text><rect x="335" y="370" width="300" height="110" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="353" y="402" font-size="21" fill="#0f172a" font-weight="600">③ 质量评估 · LLM</text><text x="353" y="433" font-size="16" fill="#334155" font-weight="normal">表达质量 / 合规变通</text><text x="353" y="458" font-size="16" fill="#334155" font-weight="normal">保留证据和置信度</text><path d="M280,165 L335,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635,165 L700,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280,295 L335,295" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635,295 L700,295" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280,425 L335,425" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635,425 L700,425" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="700" y="110" width="270" height="370" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="718" y="142" font-size="21" fill="#0f172a" font-weight="600">七维报告</text><text x="718" y="173" font-size="16" fill="#334155" font-weight="normal">每项有 pass / fail / uncertain</text><text x="718" y="198" font-size="16" fill="#334155" font-weight="normal"></text><text x="718" y="223" font-size="16" fill="#334155" font-weight="normal">总分用于观察</text><text x="718" y="248" font-size="16" fill="#334155" font-weight="normal"></text><text x="718" y="273" font-size="16" fill="#334155" font-weight="normal">关键失败 → 拒绝</text><text x="718" y="298" font-size="16" fill="#334155" font-weight="normal"></text><text x="718" y="323" font-size="16" fill="#334155" font-weight="normal">高风险或低置信 → 复核</text><text x="718" y="348" font-size="16" fill="#334155" font-weight="normal"></text><text x="718" y="373" font-size="16" fill="#334155" font-weight="normal">不能让平均分冲淡违规</text><text x="30" y="525" font-size="18" fill="#9a3412" font-weight="normal">本次反例：否定句误提取；预设“泄露”标签与真实回复不一致。</text></g></svg>