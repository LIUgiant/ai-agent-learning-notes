<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc"><title id="title">9-4 具体版本确认的时序</title><desc id="desc">时序图：模型提问，模拟用户回答，模型生成Spec，用户确认配置哈希，独立门禁比较最终配置哈希。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="670" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="28" fill="#0f172a" font-weight="700">9-4 · 确认的是哪一版？</text><text x="30" y="74" font-size="18" fill="#334155" font-weight="normal">高风险配置：问清楚、确认具体值、检查最终产物</text><rect x="50" y="105" width="240" height="68" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="68" y="137" font-size="21" fill="#0f172a" font-weight="600">模型</text><line x1="170" y1="173" x2="170" y2="590" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="380" y="105" width="240" height="68" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="398" y="137" font-size="21" fill="#0f172a" font-weight="600">模拟用户</text><line x1="500" y1="173" x2="500" y2="590" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="710" y="105" width="240" height="68" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="728" y="137" font-size="21" fill="#0f172a" font-weight="600">独立门禁</text><line x1="830" y1="173" x2="830" y2="590" stroke="#cbd5e1" stroke-dasharray="6 6"/><path d="M170,220 L500,220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="206" font-size="17" fill="#334155" font-weight="normal">1. 问 scope / permission</text><path d="M500,280 L170,280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="266" font-size="17" fill="#334155" font-weight="normal">2. 答：本班 / 只读</text><path d="M170,340 L500,340" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="326" font-size="17" fill="#334155" font-weight="normal">3. Spec：具体配置值</text><path d="M500,400 L830,400" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="520" y="386" font-size="17" fill="#334155" font-weight="normal">4. 确认，保存配置 hash</text><path d="M170,470 L830,470" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="456" font-size="17" fill="#334155" font-weight="normal">5. 最终 artifact 送检</text><rect x="635" y="505" width="330" height="100" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="653" y="537" font-size="21" fill="#0f172a" font-weight="600">相同 hash 才允许</text><text x="653" y="568" font-size="16" fill="#334155" font-weight="normal">改成“全校” → hash 改变</text><text x="653" y="593" font-size="16" fill="#334155" font-weight="normal">旧确认失效，不能直接执行</text><text x="30" y="635" font-size="16" fill="#334155" font-weight="normal">教学模型：approval 由模拟用户代码创建；生产中还需要可信身份、授权范围和有效期。</text></g></svg>