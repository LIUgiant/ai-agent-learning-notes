<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">级联取消的时序</title><desc id="d">Manager接受worker2的有效结果后广播一次取消，worker1和3应答，全部资源关闭后返回。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="660" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="28" fill="#0f172a" font-weight="600">10-4 · 级联取消，不止发一条停止消息</text><text x="30" y="76" font-size="17" fill="#334155" font-weight="400">本轮实测事件的逻辑顺序示意；纵向间距不代表耗时</text><rect x="40" y="105" width="190" height="54" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="64" y="140" font-size="21" fill="#334155" font-weight="600">Manager</text><line x1="135" x2="135" y1="159" y2="580" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="280" y="105" width="190" height="54" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="304" y="140" font-size="21" fill="#334155" font-weight="600">worker-1</text><line x1="375" x2="375" y1="159" y2="580" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="520" y="105" width="190" height="54" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="544" y="140" font-size="21" fill="#334155" font-weight="600">worker-2</text><line x1="615" x2="615" y1="159" y2="580" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="760" y="105" width="190" height="54" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="784" y="140" font-size="21" fill="#334155" font-weight="600">worker-3</text><line x1="855" x2="855" y1="159" y2="580" stroke="#cbd5e1" stroke-dasharray="6 6"/><path d="M135,195 L375,195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M135,195 L615,195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M135,195 L855,195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="160" y="185" font-size="16" fill="#334155" font-weight="400">① 分配任务，独立读取页面</text><rect x="533" y="237" width="164" height="56" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="547" y="261" font-size="16" fill="#334155" font-weight="400">② 证据校验通过</text><text x="547" y="282" font-size="15" fill="#334155" font-weight="400">target_found</text><path d="M615,312 L135,312" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="170" y="302" font-size="16" fill="#334155" font-weight="400">③ 锁内首次结算</text><path d="M135,360 L375,360" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M135,360 L615,360" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M135,360 L855,360" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="160" y="348" font-size="16" fill="#334155" font-weight="400">④ 一次 terminate 广播</text><path d="M375,418 L135,418" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="160" y="406" font-size="16" fill="#334155" font-weight="400">⑤ ack</text><path d="M855,461 L135,461" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="520" y="450" font-size="16" fill="#334155" font-weight="400">⑤ ack</text><path d="M375,523 L135,523" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M615,523 L135,523" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M855,523 L135,523" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="310" y="510" font-size="16" fill="#334155" font-weight="400">⑥ 三个 resource_closed</text><rect x="35" y="561" width="930" height="62" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="55" y="588" font-size="18" fill="#334155" font-weight="600">ack = 已进入停止分支；resource_closed = 清理完成。</text><text x="55" y="611" font-size="16" fill="#334155" font-weight="400">Manager 等待所有任务退出；取消本地等待不代表远端推理已停止或不计费。</text></g></svg>