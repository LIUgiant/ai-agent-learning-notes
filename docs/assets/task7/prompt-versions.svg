<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">9-3 版本和权限分离</title><desc id="desc">版本关系图：稳定版只读，候选由精确补丁生成，人工参考版独立比较，门禁代码不由优化模型修改。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="560" rx="20" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="28" fill="#0f172a" font-weight="700">9-3 · Prompt 版本与权限</text><text x="30" y="74" font-size="18" fill="#334155" font-weight="normal">模型可以提出候选；评测与批准由独立代码执行</text><rect x="30" y="110" width="280" height="120" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="48" y="142" font-size="21" fill="#0f172a" font-weight="600">稳定版 v0</text><text x="48" y="173" font-size="16" fill="#334155" font-weight="normal">原文保持不动</text><text x="48" y="198" font-size="16" fill="#334155" font-weight="normal">保留集 5/5 · 边界集 0/5</text><rect x="360" y="110" width="280" height="120" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="378" y="142" font-size="21" fill="#0f172a" font-weight="600">候选 v1</text><text x="378" y="173" font-size="16" fill="#334155" font-weight="normal">old_str → new_str</text><text x="378" y="198" font-size="16" fill="#334155" font-weight="normal">保留集 5/5 · 边界集 3/5</text><rect x="690" y="110" width="280" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="708" y="142" font-size="21" fill="#0f172a" font-weight="600">课程人工参考版</text><text x="708" y="173" font-size="16" fill="#334155" font-weight="normal">固定对照，不参与补丁生成</text><text x="708" y="198" font-size="16" fill="#334155" font-weight="normal">保留集 5/5 · 边界集 3/5</text><path d="M310,170 L360,170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="290" width="280" height="170" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="48" y="322" font-size="21" fill="#0f172a" font-weight="600">失败证据</text><text x="48" y="353" font-size="16" fill="#334155" font-weight="normal">B1—B5 来源案例</text><text x="48" y="378" font-size="16" fill="#334155" font-weight="normal">三维诊断 + 修改作用域</text><text x="48" y="403" font-size="16" fill="#334155" font-weight="normal">不是随意追加一条经验</text><path d="M170,290 L425,230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360" y="290" width="610" height="170" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="378" y="322" font-size="21" fill="#0f172a" font-weight="600">受保护的发布检查</text><text x="378" y="353" font-size="16" fill="#334155" font-weight="normal">补丁非空 · edits 可审计 · 来源可追溯</text><text x="378" y="378" font-size="16" fill="#334155" font-weight="normal">旧能力不退化 · 边界题改善</text><text x="378" y="403" font-size="16" fill="#334155" font-weight="normal">本次：release_to_canary 建议；没有真实部署</text><path d="M500,230 L500,290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830,230 L830,290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="520" font-size="18" fill="#334155" font-weight="normal">下一步需要：新增未知案例、逐题回归、独立复核、真实灰度与回滚。</text></g></svg>