<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 645" role="img" aria-labelledby="t d"><title id="t">网页到长期 Skill：三个信任区域</title><desc id="d">网页和摘要只作证据，候选隔离验证，经独立审核和发布门禁后成为正式能力，验证器和审计不可自行修改。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:17px;fill:#1e293b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:15px;fill:#475569}</style><rect width="920" height="645" rx="18" fill="#f5f7fb"/><text x="28" y="43" class="title">网页到长期 Skill：三个信任区域</text><text x="28" y="77" class="small">摘要不会提升可信级别；候选与正式能力隔离；批准权留在受保护边界内。</text><rect x="28" y="110" width="260" height="190" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="45" y="145" class="head">① 不可信证据</text><text x="45" y="184" class="small">原始网页 + LLM 摘要</text><text x="45" y="217" class="small">保留来源 / 定位 / 时间</text><text x="45" y="250" class="small">提取主张，不执行字符串</text><rect x="330" y="110" width="260" height="190" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="347" y="145" class="head">② 待验证候选</text><text x="347" y="184" class="small">最小 Skill diff + 作用域</text><text x="347" y="217" class="small">只在隔离测试环境加载</text><text x="347" y="250" class="small">不服务真实流量</text><rect x="632" y="110" width="260" height="190" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="649" y="145" class="head">③ 正式能力</text><text x="649" y="184" class="small">版本 + 哈希 + 批准记录</text><text x="649" y="217" class="small">正式加载器只认已发布版</text><text x="649" y="250" class="small">保留稳定备份和回滚点</text><path d="M290 203H325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M592 203H627" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="282" y="327" class="small">提案生成不等于批准；右侧箭头只能由发布门禁放行</text><rect x="28" y="358" width="864" height="159" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="48" y="394" class="head">独立验证与批准</text><text x="48" y="430" class="">结构与来源 → 权限 / 沙箱 / 依赖 → 安全与留出回归 → 原文复核</text><text x="48" y="464" class="small">高风险：人工批准；任意候选变更：重新核对版本并审核</text><text x="48" y="493" class="small">失败：保留证据，退回候选区；不能降低门槛以获得通过。</text><path d="M761 358V306" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="28" y="540" width="864" height="80" rx="12" fill="#fee2e2" stroke="#cbd5e1"/><text x="48" y="572" class="head">禁止业务 Agent 自改：验证器 / 批准测试 / 发布门槛 / 权限</text><text x="48" y="603" class="small">审计日志、稳定版本与备份也受保护；可以提议改进，不能自行批准。</text></svg>