<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 990" role="img" aria-labelledby="title-no_reasoning desc-no_reasoning">
<title id="title-no_reasoning">移除历史 reasoning：Agent 上下文与工具循环</title><desc id="desc-no_reasoning">在保存 assistant 消息时删除 reasoning_content。模型本轮仍可推理，工具调用字段和结果消息都保留。 无工具调用时转入终止文本，再独立评分；所有模式都受轮数上限约束。</desc>
<defs><marker id="arrow-no_reasoning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#617799"/></marker><marker id="cut-no_reasoning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b63b45"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:21px;font-weight:650;fill:#18243d}.body{font-size:17px;fill:#4b5d76}.code{font-family:ui-monospace,monospace;font-size:13px;fill:#506282}.tag{font-size:13px;font-weight:650}.edge{fill:none;stroke:#617799;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.label{font-size:15px;fill:#536986}</style>
<rect width="1120" height="990" rx="20" fill="#f6f8fc"/>
<text x="30" y="34" class="tag" fill="#2a51df">输入：决定模型这一轮能看到什么</text><path d="M190 235 V285 H910" class="edge" style="stroke:#617799" /><path d="M550 235 V285" class="edge" style="stroke:#617799" /><path d="M910 235 V285" class="edge" style="stroke:#617799" /><path d="M190 285 V350" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M350 425 H390" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M710 425 H750" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M910 510 V675" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M910 565 H710" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M750 755 H710" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M390 755 H350" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><path d="M30 755 H12 V425 H30" class="edge" style="stroke:#617799"  marker-end="url(#arrow-no_reasoning)"/><text x="33" y="310" class="label">组成本轮 API 请求</text><text x="925" y="641" class="label">有 tool_calls</text><text x="721" y="548" class="label">无 tool_calls</text><text x="35" y="631" class="label">下一轮 ↑</text><g><rect x="30" y="65" width="320" height="170" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="50" y="94" class="tag" fill="#2a51df">固定输入 · 每组保留</text><text x="50" y="124" class="title">系统指令 + 当前任务</text><text x="50" y="153" class="body">system：目标与规则</text><text x="50" y="178" class="body">user：四季度换汇任务</text><text x="50" y="219" class="code">conversation_history</text></g><g><rect x="390" y="65" width="320" height="170" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="410" y="94" class="tag" fill="#2a51df">历史输入 · 首轮尚无历史</text><text x="410" y="124" class="title">历史消息</text><text x="410" y="153" class="body">此前 assistant / tool 消息</text><text x="410" y="178" class="body">含调用、结果、历史 reasoning</text><text x="410" y="219" class="code">_prepare_messages_for_api()</text></g><g><rect x="750" y="65" width="320" height="170" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="770" y="94" class="tag" fill="#2a51df">能力接口 · tools</text><text x="770" y="124" class="title">工具定义</text><text x="770" y="153" class="body">工具名、用途与参数 schema</text><text x="770" y="178" class="body">告诉模型有哪些工具可选</text><text x="770" y="219" class="code">_get_tools_description()</text></g><g><rect x="30" y="350" width="320" height="160" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="50" y="379" class="tag" fill="#2a51df">保留</text><text x="50" y="409" class="title">01 · 组装请求</text><text x="50" y="438" class="body">选择 messages 与 tools</text><text x="50" y="463" class="body">不改工具的本地实现</text><text x="50" y="494" class="code">execute_task() · agent.py:757</text></g><g><rect x="390" y="350" width="320" height="160" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="410" y="379" class="tag" fill="#2a51df">保留</text><text x="410" y="409" class="title">02 · 调用模型</text><text x="410" y="438" class="body">输出文本，或结构化工具调用</text><text x="410" y="463" class="body">本轮 thinking 仍然开启</text><text x="410" y="494" class="code">client.chat.completions.create</text></g><g><rect x="750" y="350" width="320" height="160" rx="14" fill="#fff8eb" stroke="#dfbd7b" stroke-width="1.5" /><text x="770" y="379" class="tag" fill="#975b08">改这里：删除历史推理字段</text><text x="770" y="409" class="title">03 · 保存模型响应</text><text x="770" y="438" class="body">保留 assistant 与 tool_calls</text><text x="770" y="463" class="body">删除 reasoning_content</text><text x="770" y="494" class="code">_prepare_assistant_message()</text></g><rect x="390" y="533" width="320" height="74" rx="12" fill="#eaf0ff" stroke="#c6d5fa"/><text x="410" y="561" class="body">终止文本 → 单独评分</text><text x="410" y="588" class="label">有文本，不等于答案正确</text><g><rect x="750" y="675" width="320" height="160" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="770" y="704" class="tag" fill="#2a51df">程序执行 · 模型只提出调用</text><text x="770" y="734" class="title">04 · 执行工具</text><text x="770" y="763" class="body">按名称和参数调用本地函数</text><text x="770" y="788" class="body">一轮可能执行多个工具</text><text x="770" y="819" class="code">_execute_tool()</text></g><g><rect x="390" y="675" width="320" height="160" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="410" y="704" class="tag" fill="#2a51df">反馈消息 · 对应此前调用</text><text x="410" y="734" class="title">05 · 写回工具结果</text><text x="410" y="763" class="body">保留 role=tool 与调用 ID</text><text x="410" y="788" class="body">content = 实际返回的 JSON</text><text x="410" y="819" class="code">tool_call_id + content</text></g><g><rect x="30" y="675" width="320" height="160" rx="14" fill="#fff" stroke="#d3dded" stroke-width="1.5" /><text x="50" y="704" class="tag" fill="#2a51df">仍保留 · 记录不等于发送</text><text x="50" y="734" class="title">06 · 留存与下一轮</text><text x="50" y="763" class="body">本地保存调用、实际结果</text><text x="50" y="788" class="body">下一轮重新选择要发送的历史</text><text x="50" y="819" class="code">trajectory + history</text></g><rect x="30" y="875" width="1040" height="80" rx="12" fill="#eaf0ff"/><text x="52" y="906" class="body">运行边界：最多 5 轮；达到上限也要保存证据，并单独判断任务是否完成。</text><text x="52" y="933" class="label">这是主路径示意：省略异常分支与“工具调用同轮附带最终答案”的特殊路径。</text></svg>