<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">消息到达、生成回复与真实交付，是三个阶段</title><desc id="desc">概念职责图：接入和聚合后进入工作流；候选通过时效检查再发送；回执作为新事实进入系统。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs><rect width="920" height="520" rx="18" fill="#f5f7fb"/><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:16px;fill:#475569}.small{font-size:14px;fill:#64748b}.line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="45" class="title">消息到达、生成回复与真实交付，是三个阶段</text><text x="32" y="78" class="body">按已读模块整理的职责图；不是所有渠道共用的完整调用栈。</text><rect x="32" y="115" width="254" height="104" rx="12" fill="white" stroke="#dce3ef"/><rect x="32" y="129" width="4" height="25" rx="2" fill="#4f46e5"/><text x="52" y="150" class="label">接入与聚合</text><text x="52" y="180" class="body">渠道消息 / 连续片段</text><text x="52" y="207" class="body">规范化、聚合、识别来源</text><rect x="333" y="115" width="254" height="104" rx="12" fill="white" stroke="#dce3ef"/><rect x="333" y="129" width="4" height="25" rx="2" fill="#4f46e5"/><text x="353" y="150" class="label">工作流与模型</text><text x="353" y="180" class="body">决定业务路径</text><text x="353" y="207" class="body">执行查询，生成候选回复</text><rect x="634" y="115" width="254" height="104" rx="12" fill="white" stroke="#dce3ef"/><rect x="634" y="129" width="4" height="25" rx="2" fill="#4f46e5"/><text x="654" y="150" class="label">时效检查</text><text x="654" y="180" class="body">start_token 是否仍有效</text><text x="654" y="207" class="body">过期候选按业务规则处理</text><path d="M286 166H333" class="line"/><path d="M587 166H634" class="line"/><rect x="634" y="295" width="254" height="104" rx="12" fill="white" stroke="#dce3ef"/><rect x="634" y="309" width="4" height="25" rx="2" fill="#4f46e5"/><text x="654" y="330" class="label">发送队列</text><text x="654" y="360" class="body">独立于模型生成</text><text x="654" y="387" class="body">排序、等待、渠道发送</text><rect x="333" y="295" width="254" height="104" rx="12" fill="white" stroke="#dce3ef"/><rect x="333" y="309" width="4" height="25" rx="2" fill="#4f46e5"/><text x="353" y="330" class="label">回执与状态</text><text x="353" y="360" class="body">实际调用返回了什么</text><text x="353" y="387" class="body">更新交付状态</text><rect x="32" y="295" width="254" height="104" rx="12" fill="white" stroke="#dce3ef"/><rect x="32" y="309" width="4" height="25" rx="2" fill="#4f46e5"/><text x="52" y="330" class="label">新事件与新决策</text><text x="52" y="360" class="body">任务继续 / 异常处理</text><text x="52" y="387" class="body">不伪造未到达的结果</text><path d="M761 219V295" class="line"/><path d="M634 347H587" class="line"/><path d="M333 347H286" class="line"/><text x="32" y="449" class="body">业务意图：这次要办什么？       事件策略：现在应排队、取消，还是单独处理？</text><text x="32" y="483" class="label">接收成功 ≠ 生成成功 ≠ 发送成功 ≠ 渠道已确认。</text></svg>