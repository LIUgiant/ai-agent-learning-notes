<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="t d"><title id="t">会议邮件三轮请求的消息结构</title><desc id="d">第一轮发送system和user，第二轮包含模型的两个读取请求及两个工具结果，第三轮再增加写文件请求和结果，最后得到文本回复。</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:16px}.title{font-size:24px;font-weight:700}.small{font-size:14px;fill:#64748b}.head{font-size:19px;font-weight:700}.s{fill:#e0e7ff}.u{fill:#dbeafe}.a{fill:#fef3c7}.tool{fill:#d1fae5}</style><rect width="920" height="570" rx="18" fill="#f5f7fb"/><text x="28" y="40" class="title">消息快照：同一个列表，怎样逐轮长大</text><text x="28" y="72" class="small">会议组实际轨迹；色块是消息，不是函数。tools 定义作为独立参数随请求传入。</text>
<g transform="translate(28,105)"><rect width="270" height="355" rx="12" fill="white"/><text x="16" y="30" class="head">第 1 轮 · 2 条消息</text><rect x="14" y="50" width="242" height="38" rx="6" class="s"/><text x="24" y="75">system：处理规则与输出格式</text><rect x="14" y="96" width="242" height="38" rx="6" class="u"/><text x="24" y="121">user：会议邮件</text><text x="16" y="190">模型返回 2 个 tool_calls</text><text x="16" y="222" class="small">read_file(policy.json)</text><text x="16" y="248" class="small">read_file(calendar.json)</text><text x="16" y="308" class="small">应用按 for 循环逐个执行</text></g>
<g transform="translate(325,105)"><rect width="270" height="355" rx="12" fill="white"/><text x="16" y="30" class="head">第 2 轮 · 5 条消息</text><rect x="14" y="50" width="242" height="38" rx="6" class="s"/><text x="24" y="75">system</text><rect x="14" y="96" width="242" height="38" rx="6" class="u"/><text x="24" y="121">user</text><rect x="14" y="142" width="242" height="38" rx="6" class="a"/><text x="24" y="167">assistant：两个读取请求</text><rect x="14" y="188" width="242" height="38" rx="6" class="tool"/><text x="24" y="213">tool：policy 文件内容</text><rect x="14" y="234" width="242" height="38" rx="6" class="tool"/><text x="24" y="259">tool：calendar 文件内容</text><text x="16" y="313" class="small">模型此时才得到实际日历</text><text x="16" y="337" class="small">返回 write_file(result.json)</text></g>
<g transform="translate(622,105)"><rect width="270" height="355" rx="12" fill="white"/><text x="16" y="30" class="head">第 3 轮 · 7 条消息</text><rect x="14" y="50" width="242" height="120" rx="6" fill="#f1f5f9"/><text x="24" y="85">前 5 条保留</text><text x="24" y="115" class="small">包含调用请求和工具结果</text><text x="24" y="144" class="small">不是只发最后一句</text><rect x="14" y="188" width="242" height="38" rx="6" class="a"/><text x="24" y="213">assistant：写入结果请求</text><rect x="14" y="234" width="242" height="38" rx="6" class="tool"/><text x="24" y="259">tool：写入成功回执</text><text x="16" y="313" class="small">返回普通文本 → 循环结束</text><text x="16" y="337" class="small">最终本地历史共 8 条消息</text></g>
<rect x="28" y="483" width="864" height="58" rx="10" fill="#e0e7ff"/><text x="46" y="508">tool_call_id 把“模型请求”与“应用执行结果”配对。</text><text x="46" y="532" class="small">模型提出动作 → Python 真正执行 → 结果写回消息 → 下一轮模型据此回答。</text></svg>
