<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-labelledby="title desc"><title id="title">02 时序图：能接收，不代表能立即处理</title><desc id="desc">B和C在A处理期间入队，A本地完成后主线程才依次处理B和C。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.title{font-size:25px;font-weight:700}.muted{fill:#64748b;font-size:15px}.head{font-weight:700;font-size:19px}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><rect width="920" height="610" rx="18" fill="#f5f7fb"/><text x="30" y="42" class="title">02 时序图：能接收，不代表能立即处理</text><text x="30" y="74" class="muted">slow 组实际顺序；纵向间距便于阅读，不按毫秒比例绘制</text><rect x="35" y="95" width="230" height="47" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="52" y="125" class="head">生产线程</text><path d="M150 147V509" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="335" y="95" width="230" height="47" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="352" y="125" class="head">队列</text><path d="M450 147V509" stroke="#cbd5e1" stroke-dasharray="6 5"/><rect x="650" y="95" width="230" height="47" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="667" y="125" class="head">主线程 / dispatch</text><path d="M765 147V509" stroke="#cbd5e1" stroke-dasharray="6 5"/><path d="M150 182H442" class="arrow"/><text x="162" y="170" class="">① A 入队</text><path d="M450 220H757" class="arrow"/><text x="462" y="208" class="">② 取 A，开始处理</text><path d="M150 276H442" class="arrow"/><text x="162" y="264" class="">③ B 入队</text><path d="M150 318H442" class="arrow"/><text x="162" y="306" class="">④ C 入队</text><path d="M450 414H757" class="arrow"/><text x="462" y="402" class="">⑥ 取 B，开始处理</text><path d="M450 468H757" class="arrow"/><text x="462" y="456" class="">⑦ 取 C，开始处理</text><rect x="748" y="236" width="34" height="145" rx="12" fill="#c7d2fe" stroke="#dbe3ee"/><text x="518" y="357" class="">A 仍占用处理器</text><text x="515" y="384" class="muted">⑤ A 本地交付：155.647 ms</text><rect x="70" y="527" width="780" height="56" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="94" y="561" class="">关键观察：B 已被接收，却还没被处理；它不会自动修改 A 的上下文。</text></svg>