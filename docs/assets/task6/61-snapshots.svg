<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" role="img" aria-labelledby="title desc"><title id="title">03 数据快照：消息到底存在哪里</title><desc id="desc">四个队列快照对比等待事件和当前处理事件，强调取出不等于完成。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.title{font-size:25px;font-weight:700}.muted{fill:#64748b;font-size:15px}.head{font-weight:700;font-size:19px}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><rect width="920" height="590" rx="18" fill="#f5f7fb"/><text x="30" y="42" class="title">03 数据快照：消息到底存在哪里</text><text x="30" y="74" class="muted">来自 slow.json 的 pending 字段；队列只存“还没取走”的事件</text><rect x="25" y="104" width="870" height="94" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="44" y="137" class="head">① A 已取出</text><text x="265" y="132" class="muted">队头 → 队尾</text><text x="276" y="170" class="muted">[ 空 ]</text><text x="544" y="135" class="muted">正在处理</text><rect x="660" y="126" width="65" height="49" rx="12" fill="#d1fae5" stroke="#dbe3ee"/><text x="684" y="158" class="head">A</text><rect x="25" y="214" width="870" height="94" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="44" y="247" class="head">② B、C 已入队</text><text x="265" y="242" class="muted">队头 → 队尾</text><rect x="265" y="253" width="72" height="39" rx="12" fill="#e0e7ff" stroke="#dbe3ee"/><text x="291" y="280" class="head">B</text><rect x="355" y="253" width="72" height="39" rx="12" fill="#e0e7ff" stroke="#dbe3ee"/><text x="381" y="280" class="head">C</text><text x="544" y="245" class="muted">正在处理</text><rect x="660" y="236" width="65" height="49" rx="12" fill="#d1fae5" stroke="#dbe3ee"/><text x="684" y="268" class="head">A</text><rect x="25" y="324" width="870" height="94" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="44" y="357" class="head">③ B 已取出</text><text x="265" y="352" class="muted">队头 → 队尾</text><rect x="265" y="363" width="72" height="39" rx="12" fill="#e0e7ff" stroke="#dbe3ee"/><text x="291" y="390" class="head">C</text><text x="544" y="355" class="muted">正在处理</text><rect x="660" y="346" width="65" height="49" rx="12" fill="#d1fae5" stroke="#dbe3ee"/><text x="684" y="378" class="head">B</text><rect x="25" y="434" width="870" height="94" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="44" y="467" class="head">④ C 已取出</text><text x="265" y="462" class="muted">队头 → 队尾</text><text x="276" y="500" class="muted">[ 空 ]</text><text x="544" y="465" class="muted">正在处理</text><rect x="660" y="456" width="65" height="49" rx="12" fill="#d1fae5" stroke="#dbe3ee"/><text x="684" y="488" class="head">C</text><text x="30" y="566" class="muted">get() 取走 A 后，A 不在队列里；它存在于消费者的局部变量 event 中。</text></svg>