<svg xmlns="http://www.w3.org/2000/svg" width="920" height="485" viewBox="0 0 920 485" role="img" aria-labelledby="title desc"><title id="title">同一章，两条项目学习路线</title><desc id="desc">6-1到6-3对应客服；6-4到6-7对应三段式AI课堂；共同学习结果归属与实际交付。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs><rect width="920" height="485" rx="18" fill="#f5f7fb"/><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:16px;fill:#475569}.small{font-size:14px;fill:#64748b}.line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="45" class="title">同一章，两条项目学习路线</text><text x="32" y="77" class="body">先理解状态与时机，再按顺序做实验。6-1 队列与模型闭环已验证，逐课推进。</text><rect x="32" y="110" width="414" height="193" rx="12" fill="white" stroke="#dce3ef"/><rect x="32" y="124" width="4" height="25" rx="2" fill="#4f46e5"/><text x="52" y="145" class="label">A  客服与消息工作流</text><text x="52" y="175" class="body">next-tweakcube-chain</text><text x="52" y="202" class="body">6-1  事件到达 → 排队处理</text><text x="52" y="229" class="body">6-2  慢任务 → 改口 / 取消 / 恢复</text><text x="52" y="256" class="body">6-3  原生异步 → 运行中追加约束</text><rect x="474" y="110" width="414" height="193" rx="12" fill="white" stroke="#dce3ef"/><rect x="474" y="124" width="4" height="25" rx="2" fill="#0f766e"/><text x="494" y="145" class="label">B  3D AI 老师</text><text x="494" y="175" class="body">a-ai-tutor-talk-core-3d</text><text x="494" y="202" class="body">6-4  ASR → LLM → TTS → 播放</text><text x="494" y="229" class="body">6-5 / 6-6  连续感知与原生音频</text><text x="494" y="256" class="body">6-7  TTS 语速、停顿与表达</text><path d="M239 303V337H460V352" class="line"/><path d="M681 303V337H460" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="155" y="360" width="610" height="93" rx="12" fill="white" stroke="#dce3ef"/><rect x="155" y="374" width="4" height="25" rx="2" fill="#4f46e5"/><text x="175" y="395" class="label">共同问题：旧工作是否还有效？</text><text x="175" y="425" class="body">客服用 start_token 检查；课堂用 generation 检查。</text></svg>