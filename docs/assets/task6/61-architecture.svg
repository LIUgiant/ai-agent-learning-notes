<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc"><title id="title">01 架构图：谁接收，谁保存，谁执行</title><desc id="desc">生产线程通过共享队列把事件交给主线程的原版事件循环，处理器是本地替身。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.title{font-size:25px;font-weight:700}.muted{fill:#64748b;font-size:15px}.head{font-weight:700;font-size:19px}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><rect width="920" height="510" rx="18" fill="#f5f7fb"/><text x="30" y="42" class="title">01 架构图：谁接收，谁保存，谁执行</text><text x="30" y="73" class="muted">模块 / 所在线程 / 可替换边界，而不是逐行执行顺序</text><rect x="24" y="100" width="270" height="340" rx="12" fill="#eef2ff" stroke="#dbe3ee"/><text x="44" y="132" class="head">生产侧 · 后台线程</text><rect x="40" y="152" width="238" height="77" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="53" y="181" class="">课程：定时器 / 文件监听</text><text x="53" y="207" class="muted">OneShotTimer / FileWatchTrigger</text><rect x="40" y="248" width="238" height="77" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="53" y="277" class="">本次：合成家长消息</text><text x="53" y="303" class="muted">TriggerSource.emit(event)</text><text x="44" y="368" class="">只负责把事情描述成 Event</text><text x="44" y="398" class="">不等待业务处理完成</text><rect x="332" y="174" width="239" height="200" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="352" y="206" class="head">共享边界 · queue.Queue</text><text x="352" y="245" class="">FIFO：先入先出</text><text x="352" y="278" class="">内存保存待处理事件</text><text x="352" y="311" class="">线程安全 ≠ 持久化</text><text x="352" y="345" class="muted">put(event) / get()</text><path d="M278 284H326" class="arrow"/><text x="294" y="269" class="muted">写</text><rect x="608" y="100" width="288" height="340" rx="12" fill="#ecfdf5" stroke="#dbe3ee"/><text x="628" y="132" class="head">消费侧 · 主线程</text><rect x="625" y="155" width="253" height="76" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="642" y="185" class="">课程原版 EventLoop.run</text><text x="642" y="211" class="muted">取出 → dispatch → 再取出</text><path d="M571 213H619" class="arrow"/><path d="M750 231V258" class="arrow"/><rect x="625" y="264" width="253" height="83" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="642" y="297" class="">本次：确定性处理器</text><text x="642" y="325" class="muted">写本地交付记录，不调用模型</text><text x="628" y="387" class="">以后可替换成 handle_event</text><text x="628" y="414" class="muted">循环本身不负责理解业务</text><text x="30" y="485" class="muted">本次运行：真实 Python 线程与课程循环 + 模拟业务处理；不连接微信、Redis、LLM。</text></svg>