<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">学生听到了哪里，不能从生成进度猜</title><desc id="desc">示意图非实测。完整生成和合成与实际播放长度不同，打断后只提交有播放证据的前缀。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs><rect width="920" height="440" rx="18" fill="#f5f7fb"/><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:650}.body{font-size:16px;fill:#475569}.small{font-size:14px;fill:#64748b}.line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="45" class="title">学生听到了哪里，不能从生成进度猜</text><text x="32" y="79" class="body">示意状态，非延迟实测：老师准备说两句，学生只听到第一句。</text><text x="32" y="149" class="label">LLM 已生成</text><rect x="205" y="122" width="575" height="39" rx="8" fill="#e2e8f0"/><rect x="205" y="122" width="575" height="39" rx="8" fill="#6366f1"/><text x="220" y="148" style="fill:white;font-size:16px">两句文字</text><text x="32" y="217" class="label">TTS 已合成</text><rect x="205" y="190" width="575" height="39" rx="8" fill="#e2e8f0"/><rect x="205" y="190" width="575" height="39" rx="8" fill="#0d9488"/><text x="220" y="216" style="fill:white;font-size:16px">两句音频</text><text x="32" y="285" class="label">实际已播放</text><rect x="205" y="258" width="575" height="39" rx="8" fill="#e2e8f0"/><rect x="205" y="258" width="278" height="39" rx="8" fill="#d97706"/><text x="220" y="284" style="fill:white;font-size:16px">只播第一句</text><path d="M489 248V309" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/><text x="503" y="287" class="body">学生：“老师等等”</text><rect x="32" y="329" width="856" height="87" rx="12" fill="white" stroke="#dce3ef"/><rect x="32" y="343" width="4" height="25" rx="2" fill="#d97706"/><text x="52" y="364" class="label">打断要做四件事</text><text x="52" y="394" class="body">旧代失效 → 截停播放 → 取消旧管线 → 按已播事实提交历史，再开始新代</text></svg>