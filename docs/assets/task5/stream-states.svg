<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">流式恢复：四种状态不要混为一谈</title><desc id="desc">客户端注入截断；不是等待真实断网，也不是音频打断实验。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="840" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">流式恢复：四种状态不要混为一谈</text><text x="32" y="76" font-size="15" fill="#64748b">客户端注入截断；不是等待真实断网，也不是音频打断实验。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">已有提交历史</text><text x="92" y="170" font-size="16" fill="#475569">机票工具结果已经在 messages 中</text><text x="92" y="194" font-size="15" fill="#64748b">重发当前轮，不是清空整个任务重新开始。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">接收中的缓冲区</text><text x="92" y="308" font-size="16" fill="#475569">delta → text 或 tool_args 字符串</text><text x="92" y="332" font-size="15" fill="#64748b">收到一小段参数时，不应马上执行函数。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">断点快照</text><text x="92" y="446" font-size="16" fill="#475569">正文保留 30 字；工具参数保留 8 字</text><text x="92" y="470" font-size="15" fill="#64748b">记录实际收到的增量与字符级裁切位置。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">两条恢复策略</text><text x="92" y="584" font-size="16" fill="#475569">resend 丢弃半截；meta 描述断点后请求继续</text><text x="92" y="608" font-size="15" fill="#64748b">没有运行原生 prefix/prefill，不冒称支持。</text><path d="M380,630 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="657" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="687" r="16" fill="#4257b7"/><text x="62" y="693" text-anchor="middle" font-size="17" fill="white">5</text><text x="92" y="693" font-size="20" fill="#243454" font-weight="600">语义验收</text><text x="92" y="722" font-size="16" fill="#475569">总额应为 6944；酒店 city 应为东京</text><text x="92" y="746" font-size="15" fill="#64748b">另外检查是否重新提出已经发生的机票调用。</text></g></svg>