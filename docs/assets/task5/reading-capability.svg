<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 785" role="img" aria-labelledby="t"><title id="t">生成代码：从一次性产物到复用能力</title><rect width="760" height="785" rx="18" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="30" y="48" font-size="24" font-weight="700" fill="#243454">生成代码：从一次性产物到复用能力</text><rect x="28" y="78" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="109" font-size="20" font-weight="600" fill="#4257b7">1. 明确缺口</text><text x="48" y="140" font-size="16" fill="#334155">当前已有工具不能完成哪一步？</text><text x="48" y="166" font-size="15" fill="#64748b">先写输入、输出、允许的动作与验收条件。</text><text x="380" y="208" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="213" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="244" font-size="20" font-weight="600" fill="#4257b7">2. 产生候选</text><text x="48" y="275" font-size="16" fill="#334155">模型生成脚本、补丁或结构化规则</text><text x="48" y="301" font-size="15" fill="#64748b">此时得到的是待验证的工件，还不是可信能力。</text><text x="380" y="343" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="348" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="379" font-size="20" font-weight="600" fill="#4257b7">3. 执行与核验</text><text x="48" y="410" font-size="16" fill="#334155">在受限环境运行，检查结果和执行过程</text><text x="48" y="436" font-size="15" fill="#64748b">本次例子：固定测试不能由修复模型改写。</text><text x="380" y="478" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="483" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="514" font-size="20" font-weight="600" fill="#4257b7">4. 保存证据</text><text x="48" y="545" font-size="16" fill="#334155">保存代码版本、失败样本、参数和运行记录</text><text x="48" y="571" font-size="15" fill="#64748b">文件可追溯，不代表可以无条件执行。</text><text x="380" y="613" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="618" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="649" font-size="20" font-weight="600" fill="#4257b7">5. 决定是否复用</text><text x="48" y="680" font-size="16" fill="#334155">加入回归用例、明确范围、建立失效机制</text><text x="48" y="706" font-size="15" fill="#64748b">只有满足新任务条件时，才调用已有能力。</text></g></svg>