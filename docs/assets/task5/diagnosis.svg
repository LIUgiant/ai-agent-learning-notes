<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">日志诊断：从解释到可执行证据</title><desc id="desc">2 次真实模型调用；3 个测试在两种本地 HTTP 编排上重放。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="840" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">日志诊断：从解释到可执行证据</text><text x="32" y="76" font-size="15" fill="#64748b">2 次真实模型调用；3 个测试在两种本地 HTTP 编排上重放。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">先采集失败轨迹</text><text x="92" y="170" font-size="16" fill="#475569">退款漏前置校验；库存超时未降级</text><text x="92" y="194" font-size="15" fill="#64748b">每一步都有工具名、状态、耗时和 HTTP 结果。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">模型诊断</text><text x="92" y="308" font-size="16" fill="#475569">输入架构 + PRD + 轨迹，输出 problems[]</text><text x="92" y="332" font-size="15" fill="#64748b">trajectory_ids 与 focus_turns 必须指向真实记录。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">模型生成测试</text><text x="92" y="446" font-size="16" fill="#475569">输出 test_cases[] 与受限 assertion</text><text x="92" y="470" font-size="15" fill="#64748b">不是执行任意 Python；断言类型由框架解释。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">重放同一任务</text><text x="92" y="584" font-size="16" fill="#475569">buggy 注入缺陷；fixed 使用课程已有正确流程</text><text x="92" y="608" font-size="15" fill="#64748b">分别产生新轨迹，再运行相同断言。</text><path d="M380,630 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="657" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="687" r="16" fill="#4257b7"/><text x="62" y="693" text-anchor="middle" font-size="17" fill="white">5</text><text x="92" y="693" font-size="20" fill="#243454" font-weight="600">验收</text><text x="92" y="722" font-size="16" fill="#475569">buggy 全失败 + fixed 全通过</text><text x="92" y="746" font-size="15" fill="#64748b">Issue 发布未执行；模型也没有生成源码补丁。</text></g></svg>