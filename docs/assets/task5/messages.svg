<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">messages 如何增长</title><desc id="desc">简化结构；完整请求与流式回执可下载。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="840" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">messages 如何增长</text><text x="32" y="76" font-size="15" fill="#64748b">简化结构；完整请求与流式回执可下载。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">初始列表</text><text x="92" y="170" font-size="16" fill="#475569">[system, user]</text><text x="92" y="194" font-size="15" fill="#64748b">system 在 API 转换时加入；实例历史先保存 user。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">模型请求调用</text><text x="92" y="308" font-size="16" fill="#475569">assistant.tool_calls = [{id, name, arguments}]</text><text x="92" y="332" font-size="15" fill="#64748b">arguments 是 JSON 字符串，需要先解析。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">程序执行工具</text><text x="92" y="446" font-size="16" fill="#475569">Read.execute(params) → result_dict</text><text x="92" y="470" font-size="15" fill="#64748b">执行者是 Python，不是模型。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">关联结果</text><text x="92" y="584" font-size="16" fill="#475569">tool.tool_call_id = assistant.tool_calls[0].id</text><text x="92" y="608" font-size="15" fill="#64748b">结果 JSON 再变成字符串，放进 content。</text><path d="M380,630 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="657" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="687" r="16" fill="#4257b7"/><text x="62" y="693" text-anchor="middle" font-size="17" fill="white">5</text><text x="92" y="693" font-size="20" fill="#243454" font-weight="600">下一轮请求</text><text x="92" y="722" font-size="16" fill="#475569">[system, user, assistant(call), tool(result), hint]</text><text x="92" y="746" font-size="15" fill="#64748b">hint 临时添加；本地记录与发送内容可以不同。</text></g></svg>