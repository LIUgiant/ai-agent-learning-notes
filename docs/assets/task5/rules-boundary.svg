<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">正好 24 小时：为什么后端也救不了？</title><desc id="desc">本次两组都出现的真实失败，不是模拟模型错误。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="840" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">正好 24 小时：为什么后端也救不了？</text><text x="32" y="76" font-size="15" fill="#64748b">本次两组都出现的真实失败，不是模拟模型错误。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">工具给事实</text><text x="92" y="170" font-size="16" fill="#475569">hours_since_booking = 24.0</text><text x="92" y="194" font-size="15" fill="#64748b">服务端时钟固定，课程真值使用 &lt;= 24。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">模型解释错边界</text><text x="92" y="308" font-size="16" fill="#475569">“正好 24 小时已经不在窗口内”</text><text x="92" y="332" font-size="15" fill="#64748b">自然语言“内”的理解与代码不一致。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">没有发起取消调用</text><text x="92" y="446" font-size="16" fill="#475569">对话直接结束，refund_issued = 0</text><text x="92" y="470" font-size="15" fill="#64748b">后端守卫没有被调用，所以无机会纠正。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">评分揭示误拒</text><text x="92" y="584" font-size="16" fill="#475569">expect_refundable=True，但 refunded=False</text><text x="92" y="608" font-size="15" fill="#64748b">安全拦截能力 ≠ 完整任务成功率。</text><path d="M380,630 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="657" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="687" r="16" fill="#4257b7"/><text x="62" y="693" text-anchor="middle" font-size="17" fill="white">5</text><text x="92" y="693" font-size="20" fill="#243454" font-weight="600">定向后续对照</text><text x="92" y="722" font-size="16" fill="#475569">只补一句“包含 24.0，使用 &lt;= 24”</text><text x="92" y="746" font-size="15" fill="#64748b">一次病例的修复观察，不能当作总体准确率提升。</text></g></svg>