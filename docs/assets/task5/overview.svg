<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 702" role="img" aria-labelledby="title desc"><title id="title">Task 5：把“会回答”变成“可验证的执行”</title><desc id="desc">四条学习路径，共用模型、工具、状态、验证这四个概念。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="702" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">Task 5：把“会回答”变成“可验证的执行”</text><text x="32" y="76" font-size="15" fill="#64748b">四条学习路径，共用模型、工具、状态、验证这四个概念。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">Coding Agent 入门</text><text x="92" y="170" font-size="16" fill="#475569">读源码 → 改一个边界条件 → 执行固定测试</text><text x="92" y="194" font-size="15" fill="#64748b">模型提出补丁，测试进程给出结果。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">业务规则代码化</text><text x="92" y="308" font-size="16" fill="#475569">同一请求 → 两组 Agent → 独立环境评分</text><text x="92" y="332" font-size="15" fill="#64748b">说退款成功不算；实际 refund_issued 才算。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">流式中断恢复</text><text x="92" y="446" font-size="16" fill="#475569">积累 delta → 人为截断 → 重发或元指令恢复</text><text x="92" y="470" font-size="15" fill="#64748b">恢复了输出，不代表恢复了正确语义。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">日志诊断</text><text x="92" y="584" font-size="16" fill="#475569">HTTP 轨迹 + PRD → 问题 → 测试 → 双版本重放</text><text x="92" y="608" font-size="15" fill="#64748b">既要能抓到 bug，也要能在正确实现上通过。</text></g></svg>