<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">一次修复如何走完循环</title><desc id="desc">本次真实轨迹：5 轮模型调用，5 次工具执行。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="840" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">一次修复如何走完循环</text><text x="32" y="76" font-size="15" fill="#64748b">本次真实轨迹：5 轮模型调用，5 次工具执行。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">读取：Read × 2</text><text x="92" y="170" font-size="16" fill="#475569">policy.py 与 test_policy.py 进入工具结果</text><text x="92" y="194" font-size="15" fill="#64748b">模型看到 hours &lt; 24，与测试要求冲突。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">复现：RunTests</text><text x="92" y="308" font-size="16" fill="#475569">4 项测试中 exact-24h 失败</text><text x="92" y="332" font-size="15" fill="#64748b">返回 returncode=1，而不是一句“测试失败”。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">修改：Edit</text><text x="92" y="446" font-size="16" fill="#475569">把 hours &lt; 24 替换成 hours &lt;= 24</text><text x="92" y="470" font-size="15" fill="#64748b">只允许改 policy.py；测试保持不变。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">验证：RunTests</text><text x="92" y="584" font-size="16" fill="#475569">4 项测试全部通过，returncode=0</text><text x="92" y="608" font-size="15" fill="#64748b">独立验收还核对测试文件哈希。</text><path d="M380,630 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="657" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="687" r="16" fill="#4257b7"/><text x="62" y="693" text-anchor="middle" font-size="17" fill="white">5</text><text x="92" y="693" font-size="20" fill="#243454" font-weight="600">结束：无工具调用</text><text x="92" y="722" font-size="16" fill="#475569">模型输出说明，循环收到 done</text><text x="92" y="746" font-size="15" fill="#64748b">done 代表模型结束；是否成功仍由验收决定。</text></g></svg>