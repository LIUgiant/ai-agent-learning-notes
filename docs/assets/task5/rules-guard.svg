<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">规则放在哪里，决定谁拥有最终裁决权</title><desc id="desc">同一条退款意图在两条执行路径上的区别。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="840" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">规则放在哪里，决定谁拥有最终裁决权</text><text x="32" y="76" font-size="15" fill="#64748b">同一条退款意图在两条执行路径上的区别。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">共享输入</text><text x="92" y="170" font-size="16" fill="#475569">用户请求 + 自然语言政策 + get_reservation</text><text x="92" y="194" font-size="15" fill="#64748b">用户声称可退，不等于数据库允许退款。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">控制组</text><text x="92" y="308" font-size="16" fill="#475569">模型决定调用 → naive 工具无条件退款</text><text x="92" y="332" font-size="15" fill="#64748b">这条路径把业务判断交给上游模型。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">代码化组</text><text x="92" y="446" font-size="16" fill="#475569">模型填 expected_* → 后端重新算 actual_*</text><text x="92" y="470" font-size="15" fill="#64748b">expected 是自报值，不能作为放款依据。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">状态变更</text><text x="92" y="584" font-size="16" fill="#475569">actual_refundable=True 才更新 refund_issued</text><text x="92" y="608" font-size="15" fill="#64748b">False 返回 rejected，状态维持原样。</text><path d="M380,630 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="657" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="687" r="16" fill="#4257b7"/><text x="62" y="693" text-anchor="middle" font-size="17" fill="white">5</text><text x="92" y="693" font-size="20" fill="#243454" font-weight="600">独立评分</text><text x="92" y="722" font-size="16" fill="#475569">期望应退/不退 与 实际 refund_issued 对比</text><text x="92" y="746" font-size="15" fill="#64748b">误拒和误退都算失败，不能只看拦截次数。</text></g></svg>