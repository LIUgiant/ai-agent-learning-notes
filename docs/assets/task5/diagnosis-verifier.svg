<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 702" role="img" aria-labelledby="title desc"><title id="title">一个“通过”的测试，也可能不够强</title><desc id="desc">负向探针：故意把退款排在资格校验前面。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7484ae"/></marker></defs><rect width="760" height="702" rx="20" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="45" font-size="25" fill="#23314f" font-weight="700">一个“通过”的测试，也可能不够强</text><text x="32" y="76" font-size="15" fill="#64748b">负向探针：故意把退款排在资格校验前面。</text><rect x="30" y="105" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="135" r="16" fill="#4257b7"/><text x="62" y="141" text-anchor="middle" font-size="17" fill="white">1</text><text x="92" y="141" font-size="20" fill="#243454" font-weight="600">构造错误顺序</text><text x="92" y="170" font-size="16" fill="#475569">process_refund → verify_refund_eligibility</text><text x="92" y="194" font-size="15" fill="#64748b">工具都出现了，但前置条件已被违反。</text><path d="M380,216 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="243" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="273" r="16" fill="#4257b7"/><text x="62" y="279" text-anchor="middle" font-size="17" fill="white">2</text><text x="92" y="279" font-size="20" fill="#243454" font-weight="600">课程存在性断言</text><text x="92" y="308" font-size="16" fill="#475569">step_present(verify_refund_eligibility) = True</text><text x="92" y="332" font-size="15" fill="#64748b">它只数是否出现，不检查谁先谁后。</text><path d="M380,354 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="381" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="411" r="16" fill="#4257b7"/><text x="62" y="417" text-anchor="middle" font-size="17" fill="white">3</text><text x="92" y="417" font-size="20" fill="#243454" font-weight="600">需要更强的规则</text><text x="92" y="446" font-size="16" fill="#475569">check_index &lt; refund_index</text><text x="92" y="470" font-size="15" fill="#64748b">还应检查资格结果成功、订单号一致。</text><path d="M380,492 v21" stroke="#7484ae" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="519" width="700" height="106" rx="12" fill="white" stroke="#dbe2f0"/><circle cx="62" cy="549" r="16" fill="#4257b7"/><text x="62" y="555" text-anchor="middle" font-size="17" fill="white">4</text><text x="92" y="555" font-size="20" fill="#243454" font-weight="600">进一步测试</text><text x="92" y="584" font-size="16" fill="#475569">移除校验 / 反转顺序 / 更换订单 / 校验拒绝</text><text x="92" y="608" font-size="15" fill="#64748b">测试自己也需要用错误样本验证。</text></g></svg>