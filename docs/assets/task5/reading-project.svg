<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="t"><title id="t">客服与实时对话：能力应该放在哪一层</title><rect width="760" height="650" rx="18" fill="#f4f6fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="30" y="48" font-size="24" font-weight="700" fill="#243454">客服与实时对话：能力应该放在哪一层</text><rect x="28" y="78" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="109" font-size="20" font-weight="600" fill="#4257b7">1. 开发阶段：Coding Agent</text><text x="48" y="140" font-size="16" fill="#334155">读代码、定位缺陷、提出补丁、运行测试</text><text x="48" y="166" font-size="15" fill="#64748b">本次 24 小时边界修复属于这一层。</text><text x="380" y="208" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="213" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="244" font-size="20" font-weight="600" fill="#4257b7">2. 业务运行阶段：固定工具</text><text x="48" y="275" font-size="16" fill="#334155">查询资格、提交操作、读取真实状态</text><text x="48" y="301" font-size="15" fill="#64748b">客服回复与操作结果通过稳定标识关联。</text><text x="380" y="343" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="348" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="379" font-size="20" font-weight="600" fill="#4257b7">3. 实时交互阶段：会话控制</text><text x="48" y="410" font-size="16" fill="#334155">识别当前 turn、取消旧输出、管理时限</text><text x="48" y="436" font-size="15" fill="#64748b">本次只跑文字流恢复，尚未验证音频链路。</text><text x="380" y="478" text-anchor="middle" font-size="22" fill="#7484ae">↓</text><rect x="28" y="483" width="704" height="108" rx="12" fill="white" stroke="#dbe2f0"/><text x="48" y="514" font-size="20" font-weight="600" fill="#4257b7">4. 改进阶段：回归与复盘</text><text x="48" y="545" font-size="16" fill="#334155">把失败记录转成能重复执行的检查</text><text x="48" y="571" font-size="15" fill="#64748b">用错误反例测试验证器，再决定更新哪一层。</text></g></svg>