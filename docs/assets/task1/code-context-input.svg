<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">读类型：每一次索引取出什么</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">读类型：每一次索引取出什么</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">fixture · dict</text><text x="40" y="97" font-size="16" fill="#4e627d">键 results → 页面列表</text><text x="40" y="121" font-size="14" fill="#647ba2">不是模型消息列表，它是压缩器的输入数据</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">fixture[&quot;results&quot;] · list</text><text x="40" y="215" font-size="16" fill="#4e627d">第 0 项 → 单页字典</text><text x="40" y="239" font-size="14" fill="#647ba2">列表让相同接口可以处理多个页面</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">page[&quot;content&quot;] · str</text><text x="40" y="333" font-size="16" fill="#4e627d">原始资料文本 → 格式化或压缩</text><text x="40" y="357" font-size="14" fill="#647ba2">模型最终收到的是组织后的字符串</text></g></svg>