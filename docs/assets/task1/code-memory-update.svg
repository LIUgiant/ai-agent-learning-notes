<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">一次纠正改变什么</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">一次纠正改变什么</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">纠正前</text><text x="40" y="97" font-size="16" fill="#4e627d">同一个 note_id → style: code-first</text><text x="40" y="121" font-size="14" fill="#647ba2">记录来自 session-A</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">update_memory(note_id, ..., session-B)</text><text x="40" y="215" font-size="16" fill="#4e627d">content 改为 diagram-first；更新来源和 updated_at</text><text x="40" y="239" font-size="14" fill="#647ba2">修改已有条目，不是 append 新条目</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">重新加载并再次回答</text><text x="40" y="333" font-size="16" fill="#4e627d">notes 数量仍为 1；style: diagram-first</text><text x="40" y="357" font-size="14" fill="#647ba2">真实实验由脚本显式更新，不是自主矛盾消解</text></g></svg>