<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>memory-flow</title><rect width="760" height="460" rx="16" fill="#f4f6fc"/><rect x="20" y="15" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="45" font-family="system-ui,sans-serif" font-size="20" fill="#263653">1. 会话 A：用户明确表达偏好</text><text x="40" y="76" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">提取 → 核验 → NotesMemoryManager.add_memory</text><path d="M380 100v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="125" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="155" font-family="system-ui,sans-serif" font-size="20" fill="#263653">2. 文件持久化</text><text x="40" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">保存 note_id、内容、session_id 和时间</text><path d="M380 210v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="235" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="265" font-family="system-ui,sans-serif" font-size="20" fill="#263653">3. 会话 B：新实例加载</text><text x="40" y="296" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">load_memory → get_context_string → 放进当前请求</text><path d="M380 320v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="345" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="375" font-family="system-ui,sans-serif" font-size="20" fill="#263653">4. 用户纠正偏好</text><text x="40" y="406" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">update_memory 使用同一个 ID；重载后检查没有新增重复项</text></svg>