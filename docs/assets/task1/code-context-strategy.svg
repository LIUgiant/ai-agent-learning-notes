<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">同一输入，不同处理边界</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">同一输入，不同处理边界</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">原材料 + query</text><text x="40" y="97" font-size="16" fill="#4e627d">compress_search_results(search_results, query)</text><text x="40" y="121" font-size="14" fill="#647ba2">策略枚举决定进入哪一个函数</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">NO_COMPRESSION / 两种摘要</text><text x="40" y="215" font-size="16" fill="#4e627d">完整组拼接；通用摘要不使用 query；相关摘要使用 query</text><text x="40" y="239" font-size="14" fill="#647ba2">两种摘要有不同提示词，都会产生一次额外模型调用</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">统一返回 CompressedContent</text><text x="40" y="333" font-size="16" fill="#4e627d">取 out.content → 放入 variants[name]</text><text x="40" y="357" font-size="14" fill="#647ba2">随后回答阶段不需要关心摘要内部实现</text></g></svg>