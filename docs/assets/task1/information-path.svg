<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>information-path</title><rect width="760" height="460" rx="16" fill="#f4f6fc"/><rect x="20" y="15" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="45" font-family="system-ui,sans-serif" font-size="20" fill="#263653">1. 会话外的信息</text><text x="40" y="76" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">长期偏好 / 文档知识库 / 原始历史</text><path d="M380 100v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="125" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="155" font-family="system-ui,sans-serif" font-size="20" fill="#263653">2. 选择与组织</text><text x="40" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">加载记忆、检索文档、保留当前任务、必要时压缩</text><path d="M380 210v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="235" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="265" font-family="system-ui,sans-serif" font-size="20" fill="#263653">3. 构成当前请求</text><text x="40" y="296" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">系统要求 + 用户问题 + 必要证据</text><path d="M380 320v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="345" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="375" font-family="system-ui,sans-serif" font-size="20" fill="#263653">4. 模型产生回答或动作</text><text x="40" y="406" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">回答后记录轨迹；需要保存的记忆再核验写入</text></svg>