<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">新实例 → 文件 → 当前请求</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">新实例 → 文件 → 当前请求</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">NotesMemoryManager(&quot;synthetic-user&quot;)</text><text x="40" y="97" font-size="16" fill="#4e627d">构造函数 → BaseMemoryManager → load_memory</text><text x="40" y="121" font-size="14" fill="#647ba2">相同 user_id 决定读取相同实验目录中的文件</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">json.load → MemoryNote.from_dict</text><text x="40" y="215" font-size="16" fill="#4e627d">文件文本 → dict → self.notes 对象列表</text><text x="40" y="239" font-size="14" fill="#647ba2">本次验证新实例重载，没有启动完整线上服务</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">get_context_string → ask</text><text x="40" y="333" font-size="16" fill="#4e627d">对象内容格式化为字符串，再与问题拼接</text><text x="40" y="357" font-size="14" fill="#647ba2">只传新问题、不传这段字符串，模型看不到文件</text></g></svg>