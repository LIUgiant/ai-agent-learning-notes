<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>rag-flow</title><rect width="760" height="460" rx="16" fill="#f4f6fc"/><rect x="20" y="15" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="45" font-family="system-ui,sans-serif" font-size="20" fill="#263653">1. 用户问题</text><text x="40" y="76" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">同时询问退款天数、重连次数、升级码、紧急电话</text><path d="M380 100v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="125" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="155" font-family="system-ui,sans-serif" font-size="20" fill="#263653">2. BM25 检索</text><text x="40" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">top-k 决定最多提供多少片段</text><path d="M380 210v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="235" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="265" font-family="system-ui,sans-serif" font-size="20" fill="#263653">3. 证据放入上下文</text><text x="40" y="296" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">保留文档 ID，要求只依据片段回答</text><path d="M380 320v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="345" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="375" font-family="system-ui,sans-serif" font-size="20" fill="#263653">4. 验收生成结果</text><text x="40" y="406" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">逐字段核对；电话未提供应为 null；引用 ID 必须来自命中文档</text></svg>