<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 517" role="img" aria-labelledby="title"><title id="title">四个对象，四种职责</title><rect width="760" height="517" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">四个对象，四种职责</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">hits · list[dict]</text><text x="40" y="97" font-size="16" fill="#4e627d">doc_id / score / text / metadata / debug</text><text x="40" y="121" font-size="14" fill="#647ba2">本地检索结果，不会自动进入模型</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">context · str</text><text x="40" y="215" font-size="16" fill="#4e627d">[retry] 正文 … [escalation] 正文 …</text><text x="40" y="239" font-size="14" fill="#647ba2">这里仅选用 doc_id 与 text，评分调试字段不发送</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">messages · list[dict]</text><text x="40" y="333" font-size="16" fill="#4e627d">system: 输出要求；user: context + question</text><text x="40" y="357" font-size="14" fill="#647ba2">ask() → Recorded.create() → API</text></g><path d="M380 375v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="397" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="424" font-size="19" font-weight="600" fill="#233855">response → text → parsed</text><text x="40" y="451" font-size="16" fill="#4e627d">SDK 对象 → 原文字符串 → JSON 字典</text><text x="40" y="475" font-size="14" fill="#647ba2">解析失败保留 text，parsed 变成空字典</text></g></svg>