<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">本次 T42 知识库的实际命中</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">本次 T42 知识库的实际命中</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">固定查询</text><text x="40" y="97" font-size="16" fill="#4e627d">T42 refund realtime reconnect retry escalation</text><text x="40" y="121" font-size="14" fill="#647ba2">相同 BM25 参数与教学文档</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">排序后的前 3 项</text><text x="40" y="215" font-size="16" fill="#4e627d">retry → escalation → refund</text><text x="40" y="239" font-size="14" fill="#647ba2">这里展示本次实测顺序，不是永久保证</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">选择 top-1 或 top-3</text><text x="40" y="333" font-size="16" fill="#4e627d">top-1 只有重连证据；top-3 包含三项事实</text><text x="40" y="357" font-size="14" fill="#647ba2">一篇文档可能很长，所以 K 不等于 token 预算</text></g></svg>