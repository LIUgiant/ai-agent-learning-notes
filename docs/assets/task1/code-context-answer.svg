<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">两次模型调用，不要混在一起</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">两次模型调用，不要混在一起</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">摘要阶段（仅摘要组）</text><text x="40" y="97" font-size="16" fill="#4e627d">原材料 → 摘要模型 → summary 字符串</text><text x="40" y="121" font-size="14" fill="#647ba2">通用摘要 814 tokens；问题摘要 942 tokens</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">回答阶段（每组都有）</text><text x="40" y="215" font-size="16" fill="#4e627d">context + QUESTION → ask() → text / parsed</text><text x="40" y="239" font-size="14" fill="#647ba2">完整组 748；通用摘要后回答 170；问题摘要后回答 220</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">检查字段与总成本</text><text x="40" y="333" font-size="16" fill="#4e627d">refund_days / escalation_code / retry_limit</text><text x="40" y="357" font-size="14" fill="#647ba2">单次总量：748 对 984 对 1162，来自本次 usage</text></g></svg>