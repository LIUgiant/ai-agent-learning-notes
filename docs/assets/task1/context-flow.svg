<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>context-flow</title><rect width="760" height="460" rx="16" fill="#f4f6fc"/><rect x="20" y="15" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="45" font-family="system-ui,sans-serif" font-size="20" fill="#263653">1. 相同原始材料</text><text x="40" y="76" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">固定 3 项事实 + 无关讨论</text><path d="M380 100v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="125" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="155" font-family="system-ui,sans-serif" font-size="20" fill="#263653">2. 四种上下文条件</text><text x="40" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">完整 / 末尾 500 字符 / 通用摘要 / 问题摘要</text><path d="M380 210v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="235" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="265" font-family="system-ui,sans-serif" font-size="20" fill="#263653">3. 相同问题与回答要求</text><text x="40" y="296" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">只依据材料，缺失填 null</text><path d="M380 320v21m-5 -6l5 6 5 -6" fill="none" stroke="#6b7da4" stroke-width="2"/><rect x="20" y="345" width="720" height="85" rx="12" fill="white" stroke="#d8e1f1"/><text x="40" y="375" font-family="system-ui,sans-serif" font-size="20" fill="#263653">4. 分别衡量</text><text x="40" y="406" font-family="system-ui,sans-serif" font-size="16" fill="#52617a">信息保留、答案字段正确性、长度与实际调用用量</text></svg>