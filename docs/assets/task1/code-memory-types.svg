<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">从模型输出到存储记录</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">从模型输出到存储记录</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">提取结果 · dict</text><text x="40" y="97" font-size="16" fill="#4e627d">language=Chinese；style=code-first</text><text x="40" y="121" font-size="14" fill="#647ba2">学习运行器核验固定条件后，构造标准化文本</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">MemoryNote · 对象</text><text x="40" y="215" font-size="16" fill="#4e627d">note_id / content / session_id / created_at / updated_at</text><text x="40" y="239" font-size="14" fill="#647ba2">uuid4 生成记录 ID；不是用户 ID 或会话 ID</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">self.notes · list[MemoryNote]</text><text x="40" y="333" font-size="16" fill="#4e627d">append(note) 把对象放入当前实例</text><text x="40" y="357" font-size="14" fill="#647ba2">此时只是内存状态；还需要 save_memory()</text></g></svg>