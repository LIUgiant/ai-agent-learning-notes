<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 399" role="img" aria-labelledby="title"><title id="title">教学小例子：正排和倒排是两个方向</title><rect width="760" height="399" rx="16" fill="#f3f6fc"/><text x="24" y="29" font-family="system-ui,sans-serif" font-size="15" fill="#596da5">教学小例子：正排和倒排是两个方向</text><rect x="20" y="43" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="70" font-size="19" font-weight="600" fill="#233855">原文列表</text><text x="40" y="97" font-size="16" fill="#4e627d">d1: refund 13 days；d2: retry limit 4</text><text x="40" y="121" font-size="14" fill="#647ba2">文档 ID → 原文，用于最后取证据</text></g><path d="M380 139v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="161" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="188" font-size="19" font-weight="600" fill="#233855">分词与统计</text><text x="40" y="215" font-size="16" fill="#4e627d">d1 的 refund 词频 1；d2 的 retry 词频 1</text><text x="40" y="239" font-size="14" fill="#647ba2">实际分词器还处理停用词、技术术语与代码</text></g><path d="M380 257v18m-5 -6l5 6 5 -6" fill="none" stroke="#7184ad" stroke-width="2"/><rect x="20" y="279" width="720" height="94" rx="11" fill="white" stroke="#d4dfee"/><g font-family="system-ui,sans-serif"><text x="40" y="306" font-size="19" font-weight="600" fill="#233855">倒排索引</text><text x="40" y="333" font-size="16" fill="#4e627d">refund → {d1}；retry → {d2}</text><text x="40" y="357" font-size="14" fill="#647ba2">查询词 → 候选文档；不是模型生成答案</text></g></svg>