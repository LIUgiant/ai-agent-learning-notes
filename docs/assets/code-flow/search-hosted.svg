<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">本次运行：本地一次请求，远端多次搜索</title><desc id="desc">箭头按上排从左到右、下排从右到左阅读；搜索循环发生在远端。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8294b1"/></marker></defs><rect width="1120" height="570" rx="16" fill="#f5f7fc"/><text x="28" y="38" font-family="sans-serif" font-size="19" fill="#253452" font-weight="bold">本次运行：本地一次请求，远端多次搜索</text><path d="M360 167 H395" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M725 167 H760" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M925 260 V290.0 H925 V320" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="281.0" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c">返回</text><path d="M760 412 H725" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M395 412 H360" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><rect x="30" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 入口</text><text x="48" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">01 选择能力</text><text x="48" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">SearchOnlyAgent</text><text x="48" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">只返回 web_search 定义</text><rect x="395" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 请求</text><text x="413" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">02 组装请求</text><text x="413" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">model / instructions / input</text><text x="413" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">tools / tool_choice / stream</text><rect x="760" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">远端 · 托管循环</text><text x="778" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">03 搜索与补证</text><text x="778" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">模型选择查询并调用搜索</text><text x="778" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">可在一轮请求内重复执行</text><rect x="30" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 验收</text><text x="48" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">06 记录本次结论</text><text x="48" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">检查回执数量与引用</text><text x="48" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">运行通过 ≠ 事实全部正确</text><rect x="395" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 解析</text><text x="413" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">05 按类型提取</text><text x="413" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">message → 回答</text><text x="413" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">web_search_call → 行动证据</text><rect x="760" y=