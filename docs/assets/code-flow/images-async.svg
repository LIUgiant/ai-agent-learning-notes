<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">generate_image_wanx：提交 → 轮询 → 下载</title><desc id="desc">03 在未完成时重复查询；轮询循环是在等服务完成，不是模型自主决定下一步。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8294b1"/></marker></defs><rect width="1120" height="570" rx="16" fill="#f5f7fc"/><text x="28" y="38" font-family="sans-serif" font-size="19" fill="#253452" font-weight="bold">generate_image_wanx：提交 → 轮询 → 下载</text><path d="M360 167 H395" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M725 167 H760" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M925 260 V290.0 H925 V320" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="281.0" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c">返回</text><path d="M760 412 H725" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M395 412 H360" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><rect x="30" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">客户端 → 服务端</text><text x="48" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">01 提交任务</text><text x="48" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">POST prompt / negative_prompt</text><text x="48" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">X-DashScope-Async: enable</text><rect x="395" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">服务端 → 客户端</text><text x="413" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">02 返回 task_id</text><text x="413" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">检查 HTTP 与 output</text><text x="413" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">记录 request_id 和 task_id</text><rect x="760" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">客户端 · 轮询</text><text x="778" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">03 查询任务状态</text><text x="778" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">GET /tasks/{task_id}</text><text x="778" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">等待 SUCCEEDED / FAILED</text><rect x="30" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 文件证据</text><text x="48" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">06 保存并计算哈希</text><text x="48" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">图片 bytes / MIME / SHA-256</text><text x="48" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">更新样本记录后再落盘</text><rect x="395" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">客户端 · 下载</text><text x="413" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">05 下载图片字节</text><text x="413" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">GET 结果 URL</text><text x="413" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">检查下载 HTTP 状态</text><rect x="760" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">客户端 · 分支</text><text x="778" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">04 判断完成或异常</text><text x="778" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">成功：读取 results[0].url</text><text x="778" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">失败、取消、超时：抛异常</text><text x="30" y="547" font-size="13" font-family="sans-serif" fill="#697c98">03 在未完成时重复查询；轮询循环是在等服务完成，不是模型自主决定下一步。</text></svg>