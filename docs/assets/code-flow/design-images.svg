<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title"><title id="title">design-images</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7182ac"/></marker></defs><rect width="760" height="548" rx="16" fill="#f5f7fc"/><rect x="22" y="18" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="47" font-size="19" font-weight="600" fill="#263656">01 · 同一需求进入两条路线</text><text x="42" y="75" font-size="16" fill="#52627d">direct 保留原文；rewrite 请求 DeepSeek 输出 JSON</text><text x="42" y="101" font-size="14" fill="#6479aa">控制：五个需求 × 两条路线</text></g><path d="M380 120V143" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="148" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="177" font-size="19" font-weight="600" fill="#263656">02 · 汇合为统一生图输入</text><text x="42" y="205" font-size="16" fill="#52627d">prompt + negative_prompt → generate_image_wanx</text><text x="42" y="231" font-size="14" fill="#6479aa">共用图像模型与调用实现</text></g><path d="M380 250V273" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="278" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="307" font-size="19" font-weight="600" fill="#263656">03 · 异步生成，拿到的先是任务 ID</text><text x="42" y="335" font-size="16" fill="#52627d">提交 → 轮询状态 → 成功后取得图片 URL</text><text x="42" y="361" font-size="14" fill="#6479aa">task_id 是查询凭证，不是图片本身</text></g><path d="M380 380V403" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="408" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="437" font-size="19" font-weight="600" fill="#263656">04 · 落盘并建立证据对应关系</text><text x="42" y="465" font-size="16" fill="#52627d">图片 bytes → 文件路径、MIME、SHA-256、请求记录</text><text x="42" y="491" font-size="14" fill="#6479aa">记录让你能从图片追溯输入与路线</text></g></svg>