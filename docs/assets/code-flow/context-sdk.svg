<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">1-1：模型响应如何变成下一轮历史</title><desc id="desc">数据从对象转为字典，再进入消息历史；删除发生在哪一步，决定消融的含义。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8294b1"/></marker></defs><rect width="1120" height="570" rx="16" fill="#f5f7fc"/><text x="28" y="38" font-family="sans-serif" font-size="19" fill="#253452" font-weight="bold">1-1：模型响应如何变成下一轮历史</text><path d="M360 167 H395" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M725 167 H760" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M925 260 V290.0 H925 V320" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="281.0" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c">返回</text><path d="M760 412 H725" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M395 412 H360" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><rect x="30" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">SDK · 外层对象</text><text x="48" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">01 response</text><text x="48" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">choices / usage / 其他元数据</text><text x="48" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">不是整份都作为 assistant 历史</text><rect x="395" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">SDK · 消息对象</text><text x="413" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">02 choices[0].message</text><text x="413" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">content / tool_calls</text><text x="413" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">可能包含 reasoning_content</text><rect x="760" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 序列化</text><text x="778" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">03 转成 msg_dict</text><text x="778" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">message.dict() 或 model_dump()</text><text x="778" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">此操作不调用模型</text><rect x="30" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">下一轮 · 请求</text><text x="48" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">06 再选上下文</text><text x="48" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">full：保留历史</text><text x="48" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">no_history：只发 system + user</text><rect x="395" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 历史</text><text x="413" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">05 追加 assistant</text><text x="413" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">工具分支随后追加 tool 消息</text><text x="413" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">依靠 tool_call_id 匹配调用</text><rect x="760" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 消融</text><text x="778" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">04 选择删除字段</text><text x="778" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">仅 no_reasoning 删除 reasoning</text><text x="778" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">其余模式不因此删掉调用</text><text x="30" y="547" font-size="13" font-family="sans-serif" fill="#697c98">数据从对象转为字典，再进入消息历史；删除发生在哪一步，决定消融的含义。</text></svg>