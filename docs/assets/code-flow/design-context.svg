<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title"><title id="title">design-context</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7182ac"/></marker></defs><rect width="760" height="548" rx="16" fill="#f5f7fc"/><rect x="22" y="18" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="47" font-size="19" font-weight="600" fill="#263656">01 · 先选模型能看到的消息</text><text x="42" y="75" font-size="16" fill="#52627d">history 保存在本地 → api_messages 是本轮请求视图</text><text x="42" y="101" font-size="14" fill="#6479aa">边界：_prepare_messages_for_api()</text></g><path d="M380 120V143" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="148" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="177" font-size="19" font-weight="600" fill="#263656">02 · 模型提出动作，程序负责执行</text><text x="42" y="205" font-size="16" fill="#52627d">assistant.tool_calls → 工具名与参数 → 本地函数</text><text x="42" y="231" font-size="14" fill="#6479aa">边界：execute_task() → _execute_tool()</text></g><path d="M380 250V273" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="278" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="307" font-size="19" font-weight="600" fill="#263656">03 · 把动作和结果成对写回</text><text x="42" y="335" font-size="16" fill="#52627d">先保存 assistant 调用，再追加同 ID 的 tool 消息</text><text x="42" y="361" font-size="14" fill="#6479aa">状态：conversation_history 增长</text></g><path d="M380 380V403" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="408" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="437" font-size="19" font-weight="600" fill="#263656">04 · 再选下一轮上下文</text><text x="42" y="465" font-size="16" fill="#52627d">完整组看到刚才结果；no_history 再次只看到 system + user</text><text x="42" y="491" font-size="14" fill="#6479aa">循环回到第一步；终止后另做正确性评分</text></g></svg>