<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title"><title id="title">design-research</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7182ac"/></marker></defs><rect width="760" height="548" rx="16" fill="#f5f7fc"/><rect x="22" y="18" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="47" font-size="19" font-weight="600" fill="#263656">01 · 独立任务各有会话</text><text x="42" y="75" font-size="16" fill="#52627d">asean_agent 与 clarification_agent 分开创建</text><text x="42" y="101" font-size="14" fill="#6479aa">避免把距离研究的上下文带入行情任务</text></g><path d="M380 120V143" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="148" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="177" font-size="19" font-weight="600" fill="#263656">02 · 含糊任务先判断是否澄清</text><text x="42" y="205" font-size="16" fill="#52627d">first → is_clarifying_question(first)</text><text x="42" y="231" font-size="14" fill="#6479aa">当前判断是问号 + 无工具调用等启发式</text></g><path d="M380 250V273" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="278" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="307" font-size="19" font-weight="600" fill="#263656">03 · 答复续接前一响应</text><text x="42" y="335" font-size="16" fill="#52627d">第二轮 input + previous_response_id = 第一轮响应 ID</text><text x="42" y="361" font-size="14" fill="#6479aa">远端续接上下文；不是重发本地全部历史</text></g><path d="M380 380V403" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="408" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="437" font-size="19" font-weight="600" fill="#263656">04 · 执行完毕再审计数据链</text><text x="42" y="465" font-size="16" fill="#52627d">来源 → 实际输入 → 计算 → 回答</text><text x="42" y="491" font-size="14" fill="#6479aa">传输成功、工具成功与事实可信分别检查</text></g></svg>