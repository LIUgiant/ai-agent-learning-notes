<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title"><title id="title">design-search</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7182ac"/></marker></defs><rect width="760" height="548" rx="16" fill="#f5f7fc"/><rect x="22" y="18" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="47" font-size="19" font-weight="600" fill="#263656">01 · 本地限定能力</text><text x="42" y="75" font-size="16" fill="#52627d">SearchOnlyAgent._tools() → 只声明 web_search</text><text x="42" y="101" font-size="14" fill="#6479aa">本地拥有：配置、问题、请求记录</text></g><path d="M380 120V143" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="148" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="177" font-size="19" font-weight="600" fill="#263656">02 · 远端完成检索与补证</text><text x="42" y="205" font-size="16" fill="#52627d">一次 Responses 请求 → 可能产生多次搜索</text><text x="42" y="231" font-size="14" fill="#6479aa">远端拥有：本次托管工具执行过程</text></g><path d="M380 250V273" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="278" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="307" font-size="19" font-weight="600" fill="#263656">03 · 本地接收流的终态</text><text x="42" y="335" font-size="16" fill="#52627d">SSE 事件 → response.completed / response.failed</text><text x="42" y="361" font-size="14" fill="#6479aa">适配层：_post_responses()</text></g><path d="M380 380V403" stroke="#7182ac" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="408" width="716" height="102" rx="12" fill="white" stroke="#dbe2ef"/><g font-family="system-ui,sans-serif"><text x="42" y="437" font-size="19" font-weight="600" fill="#263656">04 · 用结构化结果验收</text><text x="42" y="465" font-size="16" fill="#52627d">output_items 数行动；citations 查来源；text 读结论</text><text x="42" y="491" font-size="14" fill="#6479aa">实验层：检查项不等同于事实正确性</text></g></svg>