<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="t d"><title id="t">同一需求的 direct 与 rewrite 两条路线</title><desc id="d">同一原始需求分为 A 原文与 B 改写两路，各自调用相同万相模型，最后核对两张图片是否满足原需求。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8092b0"/></marker></defs><rect width="960" height="720" rx="15" fill="#f5f7fc"/><path d="M480 145V173H245V210" fill="none" stroke="#8092b0" stroke-width="2" marker-end="url(#a)"/><path d="M480 173H715V210" fill="none" stroke="#8092b0" stroke-width="2" marker-end="url(#a)"/><path d="M245 335V380" fill="none" stroke="#8092b0" stroke-width="2" marker-end="url(#a)"/><path d="M715 335V380" fill="none" stroke="#8092b0" stroke-width="2" marker-end="url(#a)"/><path d="M245 505V542H480V585" fill="none" stroke="#8092b0" stroke-width="2" marker-end="url(#a)"/><path d="M715 505V542H480" fill="none" stroke="#8092b0" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="35" width="420" height="110" rx="10" fill="white" stroke="#dce4f0"/><text x="290" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344a83">01 · 同一条原始需求</text><text x="290" y="102" font-family="sans-serif" font-size="16" fill="#637590">保留 text 与 id；两组从同一文本开始</text><rect x="50" y="210" width="390" height="125" rx="10" fill="white" stroke="#dce4f0"/><text x="70" y="245" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344a83">02A · direct：保留原文</text><text x="70" y="277" font-family="sans-serif" font-size="16" fill="#637590">prompt = 原始需求</text><text x="70" y="302" font-family="sans-serif" font-size="16" fill="#637590">negative_prompt = 空字符串</text><rect x="520" y="210" width="390" height="125" rx="10" fill="white" stroke="#dce4f0"/><text x="540" y="245" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344a83">02B · rewrite：DeepSeek 改写</text><text x="540" y="277" font-family="sans-serif" font-size="16" fill="#637590">原始需求 → JSON 解析</text><text x="540" y="302" font-family="sans-serif" font-size="16" fill="#637590">取 prompt 与 negative_prompt</text><rect x="50" y="380" width="390" height="125" rx="10" fill="white" stroke="#dce4f0"/><text x="70" y="415" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344a83">03A · 同一个万相模型</text><text x="70" y="447" font-family="sans-serif" font-size="16" fill="#637590">生成 A 图，保存 direct 文件</text><text x="70" y="472" font-family="sans-serif" font-size="16" fill="#637590">记录实际生图参数与图片哈希</text><rect x="520" y="380" width="390" height="125" rx="10" fill="white" stroke="#dce4f0"/><text x="540" y="415" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344a83">03B · 同一个万相模型</text><text x="540" y="447" font-family="sans-serif" font-size="16" fill="#637590">生成 B 图，保存 rewrite 文件</text><text x="540" y="472" font-family="sans-serif" font-size="16" fill="#637590">记录实际生图参数与图片哈希</text><rect x="270" y="585" width="420" height="105" rx="10" fill="white" stroke="#dce4f0"/><text x="290" y="620" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344a83">04 · 对照图片与原始需求</text><text x="290" y="652" font-family="sans-serif" font-size="16" fill="#637590">执行成功、文案正确、风格满足分别判断</text></svg>