<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">两轮澄清：本地保存 ID，远端关联会话</title><desc id="desc">两次 process_request 使用同一个澄清 Agent；本地 history 不是本次请求携带的全部消息。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8294b1"/></marker></defs><rect width="1120" height="570" rx="16" fill="#f5f7fc"/><text x="28" y="38" font-family="sans-serif" font-size="19" fill="#253452" font-weight="bold">两轮澄清：本地保存 ID，远端关联会话</text><path d="M360 167 H395" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M725 167 H760" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M925 260 V290.0 H925 V320" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="281.0" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c">返回</text><path d="M760 412 H725" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M395 412 H360" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><rect x="30" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 独立实例</text><text x="48" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">01 新建澄清 Agent</text><text x="48" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">previous_response_id = None</text><text x="48" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">不会沿用首都任务的状态</text><rect x="395" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">请求 1 → 远端</text><text x="413" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">02 发送模糊需求</text><text x="413" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">input = AMBIGUOUS_TASK</text><text x="413" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">模型先问数据源与指标</text><rect x="760" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 响应 1</text><text x="778" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">03 保存响应 ID</text><text x="778" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">previous_response_id = response.id</text><text x="778" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">运行器判定是否先提问</text><rect x="30" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本地 · 验收</text><text x="48" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">06 检查协议与任务</text><text x="48" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">前后 ID 是否匹配</text><text x="48" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">还要单独检查计算输入来源</text><rect x="395" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">远端 · 托管工具</text><text x="413" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">05 搜索与执行代码</text><text x="413" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">web_search + code_interpreter</text><text x="413" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">返回日志、引用和正文</text><rect x="760" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">请求 2 → 远端</text><text x="778" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">04 发送澄清答案</text><text x="778" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">input = CLARIFICATION_REPLY</text><text x="778" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">附上 previous_response_id</text><text x="30" y="547" font-size="13" font-family="sans-serif" fill="#697c98">两次 process_request 使用同一个澄清 Agent；本地 history 不是本次请求携带的全部消息。</text></svg>