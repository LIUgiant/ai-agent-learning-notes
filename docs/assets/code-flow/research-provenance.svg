<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">失败追踪：能运行的代码，仍可能使用错误的数据</title><desc id="desc">01—05 是实测复盘；06 是建议约束，不是已经修复并复跑的结果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8294b1"/></marker></defs><rect width="1120" height="570" rx="16" fill="#f5f7fc"/><text x="28" y="38" font-family="sans-serif" font-size="19" fill="#253452" font-weight="bold">失败追踪：能运行的代码，仍可能使用错误的数据</text><path d="M360 167 H395" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M725 167 H760" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="157" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M925 260 V290.0 H925 V320" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="281.0" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c">返回</text><path d="M760 412 H725" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="742.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><path d="M395 412 H360" fill="none" stroke="#8294b1" stroke-width="2" marker-end="url(#arrow)"/><text x="377.5" y="402" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#667c9c"></text><rect x="30" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">实测 · 外部依赖</text><text x="48" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">01 请求行情数据</text><text x="48" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">代码工具环境联网失败</text><text x="48" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">未取得指定逐日观测值</text><rect x="395" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">实测 · 模型生成代码</text><text x="413" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">02 改用趋势与噪声</text><text x="413" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">base + random.uniform(...)</text><text x="413" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">价格序列由代码构造</text><rect x="760" y="75" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="103" font-size="12" font-family="sans-serif" fill="#4051b5">实测 · 计算</text><text x="778" y="137" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">03 计算指标并作答</text><text x="778" y="169" font-size="14" font-family="sans-serif" fill="#5b6f8d">计算可在假输入上正常结束</text><text x="778" y="195" font-size="14" font-family="sans-serif" fill="#5b6f8d">输出自称来源为 Web Search</text><rect x="30" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="48" y="348" font-size="12" font-family="sans-serif" fill="#b47727">建议 · 未加入运行器</text><text x="48" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">06 缺数据就停止</text><text x="48" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">不发布真实行情指标</text><text x="48" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">明确说明未完成采集</text><rect x="395" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="413" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">本次 · 独立审计</text><text x="413" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">05 追查输入构造</text><text x="413" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">检查实际执行的代码</text><text x="413" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">拒绝把生成价格当真实数据</text><rect x="760" y="320" width="330" height="185" rx="10" fill="white" stroke="#dce4f0"/><text x="778" y="348" font-size="12" font-family="sans-serif" fill="#4051b5">上游 · 形式检查</text><text x="778" y="382" font-size="20" font-family="sans-serif" font-weight="bold" fill="#253452">04 passed = true</text><text x="778" y="414" font-size="14" font-family="sans-serif" fill="#5b6f8d">工具、引用、指标词均存在</text><text x="778" y="440" font-size="14" font-family="sans-serif" fill="#5b6f8d">但没有检查数据来源</text><text x="30" y="547" font-size="13" font-family="sans-serif" fill="#697c98">01—05 是实测复盘；06 是建议约束，不是已经修复并复跑的结果。</text></svg>