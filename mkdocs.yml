site_url: https://LIUgiant.github.io/ai-agent-learning-notes/
repo_url: https://github.com/LIUgiant/ai-agent-learning-notes
repo_name: LIUgiant/ai-agent-learning-notes
site_name: AI 学习手记
site_description: 从实验现象出发，理解 Agent 的代码与设计。
use_directory_urls: false
theme:
  name: material
  language: zh
  font: false
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/notes.css
extra_javascript:
  - javascripts/notes.js
nav:
  - 首页: index.md
  - Task 0 · Agent 基础:
      - 学习导读: task0/index.md
      - 基础概念: task0/concepts.md
