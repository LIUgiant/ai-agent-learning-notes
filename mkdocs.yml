site_url: https://LIUgiant.github.io/ai-agent-learning-notes/
repo_url: https://github.com/LIUgiant/ai-agent-learning-notes
repo_name: LIUgiant/ai-agent-learning-notes
site_name: AI 学习手记
site_description: 从实验现象出发，理解 Agent 的代码与设计。
use_directory_urls: false
theme:
  name: material
  language: zh
  font: false
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/notes.css
extra_javascript:
  - javascripts/notes.js
nav:
  - 首页: index.md
  - Task 0 · Agent 基础:
      - 学习导读: task0/index.md
      - 基础概念: task0/concepts.md
      - 环境与离线验证: task0/environment.md
      - 代码来源与阅读约定: task0/code-guide.md
      - 1-1 上下文消融:
          - 实验与结果: task0/ablation.md
          - 设计思路与代码精读: task0/source.md
          - 源码摘录备查: task0/source-reference.md
      - 1-2 多轮搜索:
          - 实验与结果: task0/search.md
          - 设计思路与代码精读: task0/search-code.md
          - 源码摘录备查: task0/search-code-reference.md
      - 1-3 搜索与计算:
          - 实验与结果: task0/research.md
          - 设计思路与代码精读: task0/research-code.md
          - 源码摘录备查: task0/research-code-reference.md
      - 1-4 生图工作流:
          - 实验与结果: task0/images.md
          - 设计思路与代码精读: task0/images-code.md
          - 源码摘录备查: task0/images-code-reference.md
      - 复盘与证据边界: task0/review.md
  - Task 1 · 上下文与 Memory / RAG:
      - 学习任务与范围: task1/index.md
      - 概念与项目联系: task1/concepts.md
      - 上下文组织与压缩:
          - 实验说明: task1/context.md
          - 一步步读源码: task1/context-code.md
      - 跨会话长期记忆:
          - 实验说明: task1/memory.md
          - 一步步读源码: task1/memory-code.md
      - 检索与 RAG:
          - 实验说明: task1/rag.md
          - 一步步读源码: task1/rag-code.md
      - 实验结果与源码复现: task1/evidence.md
  - Task 2 · 第 2 章上下文工程实验:
      - 学习任务与范围: task2/index.md
      - 概念：上下文工程在管什么: task2/concepts.md
      - KV Cache 错误模式:
          - 实验说明: task2/kv-cache.md
          - 一步步读源码: task2/kv-cache-code.md
      - 提示注入攻防:
          - 实验说明: task2/prompt-injection.md
          - 一步步读源码: task2/prompt-injection-code.md
      - System-Hint 状态栏:
          - 实验说明: task2/system-hint.md
          - 一步步读源码: task2/system-hint-code.md
      - 提示词消融:
          - 实验说明: task2/prompt-engineering.md
          - 一步步读源码: task2/prompt-engineering-code.md
      - 上下文压缩六策略:
          - 实验说明: task2/context-compression.md
          - 一步步读源码: task2/context-compression-code.md
      - 运行证据与复现: task2/evidence.md
  - 持续学习:
      - Task 索引: tasks.md
      - 新 Task 写作模板: template.md
      - 网站维护与发布: maintaining.md
