      - 代码来源与阅读约定: task0/code-guide.md
      - 1-1 上下文消融:
          - 实验与结果: task0/ablation.md
          - 设计思路与代码精读: task0/source.md
          - 源码摘录备查: task0/source-reference.md
      - 1-2 多轮搜索:
